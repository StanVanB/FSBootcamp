<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Order Form</title>
    <!-- Bootstrap CSS for styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="text-center mb-4 text-primary">☕ Café Order Form</h2>
            
            <form id="orderForm">
                <!-- Name Field -->
                <div class="mb-3">
                    <label for="customerName" class="form-label fw-bold">Name:</label>
                    <input type="text" id="customerName" class="form-control" placeholder="Enter your name" required>
                </div>

                <!-- Coffee Selection (Radio Buttons) -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Which coffee would you like to order?</label>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="coffeeSelect" id="turkish" value="Turkish coffee" data-price="3" checked>
                        <label class="form-check-label" for="turkish">Turkish coffee - $3</label>
                    </div>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="coffeeSelect" id="american" value="American coffee" data-price="5">
                        <label class="form-check-label" for="american">American coffee - $5</label>
                    </div>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="coffeeSelect" id="icedLatte" value="Iced latte" data-price="7">
                        <label class="form-check-label" for="icedLatte">Iced latte - $7</label>
                    </div>
                </div>

                <!-- Extras Selection (Checkboxes) -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Do you need any extras?</label>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="extraCoffee" value="Extra coffee" data-price="1.5">
                        <label class="form-check-label" for="extraCoffee">Extra coffee - $1.50</label>
                    </div>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="whippedCream" value="Whipped cream" data-price="2">
                        <label class="form-check-label" for="whippedCream">Whipped cream - $2.00</label>
                    </div>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="extraCaramel" value="Extra caramel" data-price="3">
                        <label class="form-check-label" for="extraCaramel">Extra caramel - $3.00</label>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100">Place Order</button>
            </form>

            <!-- Order Summary Section -->
            <div class="mt-4 p-3 bg-white border rounded d-none" id="summaryBox">
                <h4 class="text-success">📋 Order Summary</h4>
                <p id="orderSummary" class="mb-0"></p>
            </div>
        </div>
    </div>

    <!-- JavaScript to handle submission and calculation -->
    <script>
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page from reloading
            
            // Get Name
            const name = document.getElementById('customerName').value;
            
            // Get Selected Coffee & Price
            const selectedCoffeeRadio = document.querySelector('input[name="coffeeSelect"]:checked');
            const coffeeName = selectedCoffeeRadio.value;
            let totalPrice = parseFloat(selectedCoffeeRadio.getAttribute('data-price'));
            
            // Get Selected Extras & Prices
            let extras = [];
            const extraCheckboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            extraCheckboxes.forEach(function(checkbox) {
                extras.push(checkbox.value);
                totalPrice += parseFloat(checkbox.getAttribute('data-price'));
            });
            
            // Build Summary Text
            let extrasText = extras.length > 0 ? extras.join(', ') : 'None';
            
            const summaryParagraph = document.getElementById('orderSummary');
            summaryParagraph.innerHTML = `
                <strong>Customer Name:</strong> ${name}<br>
                <strong>Coffee:</strong> ${coffeeName}<br>
                <strong>Extras:</strong> ${extrasText}<br>
                <hr>
                <strong class="text-dark fs-5">Total Price: $${totalPrice.toFixed(2)}</strong>
            `;
            
            // Reveal the summary box
            document.getElementById('summaryBox').classList.remove('d-none');
        });
    </script>
</body>
</html>
