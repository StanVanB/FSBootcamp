<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos Catalog - Grid</title>
    <!-- Bootstrap 4 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Custom CSS Document Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="startup_website.html">📷 PhotoAlbum</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="startup_website.html">Home page</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="catalog.html">Catalog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="feedback.html">Feedback</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Header Jumbotron -->
    <div class="jumbotron jumbotron-fluid text-center bg-primary text-white mb-0">
        <div class="container">
            <h1 class="display-4">Photo Catalog</h1>
            <p class="lead">A beautifully arranged responsive grid of our collections.</p>
        </div>
    </div>

    <!-- 3x3 Grid Section -->
    <div class="container my-5">
        <!-- Row 1 -->
        <div class="row text-center mb-4">
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1604428803896-c1e5151d4128?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Mountain sunrise" class="img-fluid catalog-img">
                <div class="photo-title">Mountain Sunrise</div>
            </div>
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1559827260-dc66d52bef19?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Ocean waves" class="img-fluid catalog-img">
                <div class="photo-title">Ocean Waves</div>
            </div>
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Forest path" class="img-fluid catalog-img">
                <div class="photo-title">Forest Path</div>
            </div>
        </div>

        <!-- Row 2 -->
        <div class="row text-center mb-4">
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1444723121867-7a241cacace9?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="City lights" class="img-fluid catalog-img">
                <div class="photo-title">City Lights</div>
            </div>
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1621795307430-3ff25aa08945?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Desert dunes" class="img-fluid catalog-img">
                <div class="photo-title">Desert Dunes</div>
            </div>
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1638477402360-419165c0e395?q=80&w=1471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Misty lake" class="img-fluid catalog-img">
                <div class="photo-title">Misty Lake</div>
            </div>
        </div>

        <!-- Row 3 -->
        <div class="row text-center mb-4">
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1454129170132-347ea87dc9dd?q=80&w=1515&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Autumn leaves" class="img-fluid catalog-img">
                <div class="photo-title">Autumn Leaves</div>
            </div>
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1494&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Starry night" class="img-fluid catalog-img">
                <div class="photo-title">Starry Night</div>
            </div>
            <div class="col-md-4 mb-3">
                <img src="https://images.unsplash.com/photo-1643875407894-80a5d66c8556?q=80&w=1471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Urban architecture" class="img-fluid catalog-img">
                <div class="photo-title">Urban Architecture</div>
            </div>
        </div>
    </div>

    <!-- Required Scripts: jQuery first, then Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery Logic to apply styling rules -->
    <script>
        $(document).ready(function() {
            // Apply borders to images
            $('.catalog-img').css({
                'border': '3px solid #343a40',
                'border-radius': '5px'
            });

            // Apply font family and custom color to titles
            $('.photo-title').css({
                'font-family': 'Georgia, serif',
                'color': '#2c3e50',
                'font-weight': 'bold',
                'margin-top': '10px'
            });
        });
    </script>
</body>
</html>
