<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Create a New Task</h2>
        <form>
            <!-- Title Input -->
            <div class="form-group mb-3">
                <label for="title" class="form-label">Title:*</label>
                <input type="text" id="title" class="form-control" required>
            </div>

            <!-- Description Textarea -->
            <div class="form-group mb-3">
                <label for="description" class="form-label">Description:*</label>
                <textarea id="description" class="form-control" required></textarea>
            </div>

            <!-- Category Dropdown -->
            <div class="form-group mb-3">
                <label for="category" class="form-label">Category:</label>
                <select id="category" class="form-control">
                    <option value="">Choose...</option> <!-- This is the new line -->
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Education">Education</option>
                </select>
            </div>

            <!-- Priority Level Dropdown -->
            <div class="form-group mb-3">
                <label for="priority" class="form-label">Priority Level:</label>
                <select id="priority" class="form-control">
                    <option value="">Choose...</option> <!-- ADD THIS LINE HERE -->
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <!-- Progress Level Dropdown -->
            <div class="form-group mb-3">
                <label for="progress" class="form-label">Progress Level:</label>
                <select id="progress" class="form-control">
                    <option value="">Choose...</option> <!-- ADD THIS LINE HERE -->
                    <option value="Not Started">Not Started</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <!-- Submit Button styled with Bootstrap -->
            <button type="submit" class="btn btn-primary" onclick="validateInputs()">Submit Task</button>
        </form>
    </div>
    <script>
        function validateInputs() {
            // 1. Grab the elements
            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const category = document.getElementById("category").value;
            const priority = document.getElementById("priority").value;
            const progress = document.getElementById("progress").value;

            // 2. Check if they are empty
            if (title === "") { alert("Title is empty"); return; }
            if (description === "") { alert("Description is empty"); return; }
            if (category === "") { alert("Category is empty"); return; }
            if (priority === "") { alert("Priority Level is empty"); return; }
            if (progress === "") { alert("Progress Level is empty"); return; }
        }
    </script>
</body>
</html>
