<html>
    <head>
        <title>Advance CSS</title>
    </head>
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto;
            grid-template-rows: 100px;
            background-color: gray;
            padding:20px;
            /* gap: 40px; */
            column-gap: 30px;
            row-gap: 45px;
        }
        .container > div {
            background-color: lightblue;
            border: 1px solid black;
            padding: 20px;
            font-size: 30px;
            text-align: center;
        }
        .navbar {
            grid-column: 1 / 3;
        }
    </style>
    <body>
        <h1>CSS Grid Layout</h1>
        <div class="container">
            <div class="navbar">1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </div>
    </body>
</html>
