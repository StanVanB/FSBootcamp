<html>

<head>
    <title>Sign Up</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // $(document).ready(function(){

        // });

        $(document).ready(function () {
            $('form').submit(function (event) {
                var name = $('#name').val();
                var email = $("#email").val();
                var password = $("#password").val();
                $("#nameError").hide();
                $("#emailError").hide();
                $("#passwordError").hide();

                if(name === "" && email === "" && password === ""){
                    $("#nameError").show();
                    $("#emailError").show();
                    $("#passwordError").show();
                    event.preventDefault(); // Prevent the default form submission
                } else if(name === ""){
                    $("#nameError").show();
                    event.preventDefault();
                }  else if(email === ""){
                    $("#emailError").show();
                    event.preventDefault();
                } else if(password === ""){
                    $("#passwordError").show();
                    event.preventDefault();
                }

            });
        });

    </script>

</head>

<body>
    <h1>Sign Up</h1>
    <form action="submit.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br>
        <span id="nameError" style="color: red; display:none; ">Name is required</span><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br>
        <span id="emailError" style="color: red; display:none; ">Email is required</span><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br>
        <span id="passwordError" style="color: red; display:none; ">Password is required</span><br>

        <input type="submit" value="Sign Up">
    </form>
</body>

</html>
