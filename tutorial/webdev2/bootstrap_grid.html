<html>
    <head>
        <title>Bootstrap Grid System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-sm-8 bg-primary text-white">Column 1</div>
                <div class="col bg-success text-white">Column 2</div>
                <div class="col-sm-2 bg-info text-white">Column 3</div>
                <div class="col bg-warning text-white">Column 4</div>
            </div>
            <div class="row">
                <div class="col-sm-6 bg-danger text-white">Column 1</div>
                <div class="col bg-secondary text-white">Column 2</div>
                <div class="col-sm-4 bg-dark text-white">Column 3</div>
                <div class="col bg-light text-dark">Column 4</div>
            </div>
        </div>
    </body>
</html>
