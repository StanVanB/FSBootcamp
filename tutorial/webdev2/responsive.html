<html>
    <head>
        <title>Responsive</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <!--  Add -->
      <!-- Create a new page 
      Add an image, heading and 2 paragraphs to the page
      Make them responsive. Feel free to use responsive design or media queries. -->
    <style>
        .parent {
            font-size: 14px;
        }
        .child {
            font-size: 2em;
        }
        img{
            /* vw = viewport width 
            vh = viewport height */
            width:50vw;
            height: 50vh;
        }
        p {
            font-size: 5vw;
        }

        @media(orientation: portrait) and (max-width: 767px) {
            body {
                background-color: yellow;
            }
        }
        @media(orientation: landscape) and (min-width: 768px) {
            body {
                background-color: red;
            }
        }
    </style>
    <body>
        <div class="parent">
            This is a parent element.
        </div>
        <div class="child">
            This is a child element.
            <div class="child">
            This is a child element.
        </div>
        </div>
        <p>This is a paragraph.</p>
        <img src="https://static.vecteezy.com/system/resources/thumbnails/049/671/177/small/tiger-amazing-background-hd-wallpaper-photo.jpeg"
        alt="Image not found">
    </body>
</html>
