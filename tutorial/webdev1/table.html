<html>
    <head>
        <title>Table Example</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <!-- This is an example of internal styling -->

    <!--
        1. inline styles gets the priority over internal and external styles.
        2. Internal styles gets the priority over external styles.
        3. External styles gets the priority over browser default styles.
    -->
<body>

    <!-- This is an example of inline styling -->

    <h1 style="color:red;background-color: aqua;">Table Example</h1>

    <h1 class="bg-blue">This is another heading</h1>

    <p style="color: green;background-color: yellow;font-size: 28px;">
        This is a paragraph
    </p>

    <p>This is my paragraph 1</p>

    <div class="bg-blue">
        <h3>This is a h3 tag</h3>
        <p id="header">This is my paragraph 2</p>
    </div>

    <div>
        <h4 class="bg-blue">This is my heading 4</h4>
        <span>This is my span</span>
    </div>

    <table>
        <tr>
            <td>Name</td>
            <td>Age</td>
            <td>City</td>
        </tr>
        <tr>
            <td>John</td>
            <td>25</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>Andrew</td>
            <td>48</td>
            <td>Spruce Grove</td>
        </tr>
    </table>
