<html>
<head>
    <title>User Form</title>
</head>
<body>
    <h1>User Form</h1>
    <form action="submission.php" method="GET">
        <label for="name">Name:</label>
        <input type="text" name="full_name" value="Sam">

        <label for="email">Email:</label>
        <input type="email" name="email" 
        placeholder="harsh@gmail.com">

        <label for="password">Password:</label>
        <input type="password" name="password">

        <label for="gender">Gender</label>
        <select name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
        </select>

        <label for="gender">Radio Example</label>
        <input type="radio" name="radio_button_gender" value="male">Male
        <input type="radio" name="radio_button_gender" value="female">Female

        <input type="submit" value="Submit">
    </form>
</body>
</html>
